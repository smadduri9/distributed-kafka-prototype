# KafkaDS broker node 3
# All brokers must use the same partition.count, replication.factor and broker ids: each computes the partition assignment locally.
node.id=3
host=127.0.0.1
port=9093

# Comma-separated peers as id@host:port (excluding self)
peers=1@127.0.0.1:9091,2@127.0.0.1:9092

# Storage and partitions
log.dir=data/broker-3
partition.count=3
# Replicas per partition (capped at the broker count)
replication.factor=3
# Milliseconds a produce with acks=quorum or acks=all waits before answering with an "uncertain" error
produce.timeout.ms=3000
segment.bytes=16777216
index.interval.bytes=4096

# Raft timing (every partition is a Raft group)
raft.election.timeout.min.ms=500
raft.election.timeout.max.ms=1000
raft.heartbeat.interval.ms=150

# Peer discovery (defaults to static id@host:port from `peers`).
#raft.discovery.mode=static
