# KafkaDS broker node 1
node.id=1
host=127.0.0.1
port=9091

# Comma-separated peers as id@host:port (excluding self)
peers=2@127.0.0.1:9092,3@127.0.0.1:9093

# Storage
log.dir=data/broker-1
partition.count=1
segment.bytes=16777216
index.interval.bytes=4096

# Raft (Phase 3)
raft.election.timeout.min.ms=500
raft.election.timeout.max.ms=1000
raft.heartbeat.interval.ms=150

# Peer discovery (defaults to static id@host:port from `peers`).
# dns-hostname: explicitly resolve each peer host to A/AAAA records.
# dns-srv: discover peers from a single SRV name (Kubernetes headless service);
#          node ids are parsed from targets like <prefix><id>.<service>...
#raft.discovery.mode=static
#raft.discovery.srv.name=_raft._tcp.kafkads-headless.default.svc.cluster.local
#raft.discovery.hostname.prefix=broker-
#raft.discovery.ttl.min.ms=1000
#raft.discovery.ttl.max.ms=300000
#raft.discovery.ip.preference=ipv4
